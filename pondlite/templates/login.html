<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · PondLite</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body class="login-page"><main class="login-card"><a class="brand" href="/"><span class="brand-mark">P</span><span>PondLite</span></a><p class="brand-tagline">Small data. Useful models.</p><div class="login-copy"><h1>Your model workspace.</h1><p>Sign in to manage data, training, evaluation, and live answers.</p></div>{% if error %}<div class="error-panel" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary-button full-button" type="submit">Sign in</button></form></main></body></html>
